<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career Predictions — FuturePath AI</title>
  <meta name="description" content="AI-powered top 5 career predictions with confidence scores and reasoning." />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .predict-banner {
      background: var(--grad-card); border: 1px solid rgba(108,99,255,.25);
      border-radius: var(--r-xl); padding: 28px 32px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px;
    }
    .predict-banner h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .predict-banner p  { font-size: 14px; color: var(--text-secondary); }

    .career-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 20px; }

    .career-card-full {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--r-xl); overflow: hidden;
      transition: var(--transition); cursor: pointer;
    }
    .career-card-full:hover { border-color: var(--border-hover); transform: translateY(-3px); box-shadow: var(--shadow-glow); }
    .career-card-full.rank-1 { border-color: rgba(255,215,0,.4); grid-column: 1/-1; }

    .ccf-header {
      padding: 20px 22px; display: flex; align-items: flex-start; gap: 16px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(108,99,255,.06), transparent);
    }
    .ccf-icon {
      width: 52px; height: 52px; border-radius: var(--r-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; flex-shrink: 0;
      background: rgba(108,99,255,.14); border: 1px solid rgba(108,99,255,.2);
    }
    .ccf-title   { font-family:'Outfit',sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 3px; }
    .ccf-domain  { font-size: 12px; color: var(--text-muted); }
    .ccf-meta    { display: flex; gap: 8px; margin-top: 8px; flex-wrap:wrap; }
    .ccf-rank    { margin-left: auto; }
    .rank-badge  {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
      background: rgba(108,99,255,.2); border: 1px solid rgba(108,99,255,.3);
      color: var(--primary-light);
    }
    .rank-1 .rank-badge { background: linear-gradient(135deg,#ffd700,#ffa500); border-color:#ffd700; color:#000; }

    .ccf-body { padding: 20px 22px; }
    .ccf-score-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .ccf-pct {
      font-family:'Outfit',sans-serif; font-size: 32px; font-weight: 900;
      background: var(--grad-primary);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      white-space:nowrap;
    }
    .ccf-confidence-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .ccf-desc { font-size: 13.5px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 14px; }

    .ccf-footer {
      padding: 14px 22px; border-top: 1px solid var(--border);
      display: flex; gap: 10px; background: rgba(255,255,255,.02);
    }

    /* Reasoning box */
    .reasoning-box {
      background: rgba(108,99,255,.07); border: 1px solid rgba(108,99,255,.2);
      border-radius: var(--r-md); padding: 14px 16px; margin-top: 12px;
    }
    .reasoning-box h4 { font-size: 12px; font-weight: 700; color: var(--primary-light);
      margin-bottom: 10px; letter-spacing: .5px; text-transform:uppercase; }
    .reason-item {
      display: flex; gap: 8px; align-items: flex-start;
      font-size: 13px; color: var(--text-secondary); margin-bottom: 6px;
    }
    .reason-item::before { content:'•'; color: var(--primary-light); font-weight:700; flex-shrink:0; }

    /* Matched skills in card */
    .matched-skills { display: flex; flex-wrap: wrap; gap: 5px; }

    /* No-skill warning */
    .no-skill-state { text-align:center; padding: 60px 20px; }
    .no-skill-state .ns-icon { font-size: 56px; opacity:.4; margin-bottom:14px; }
    .no-skill-state h2 { font-size: 22px; margin-bottom: 8px; }
    .no-skill-state p  { color: var(--text-secondary); max-width: 380px; margin: 0 auto 20px; }

    .rank-1 .ccf-header { background: linear-gradient(135deg, rgba(255,215,0,.06), rgba(108,99,255,.06)); }
  </style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="app-container">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <header class="topbar" id="topbar"></header>

    <div id="page-alert" style="padding:0 36px"></div>

    <div class="page-content">
      <!-- Predict banner -->
      <div class="predict-banner anim-fade-up">
        <div>
          <h2>🎯 AI Career Predictions</h2>
          <p>Weighted match based on your skills, interests, and academic profile</p>
        </div>
        <div class="flex gap-10 items-center">
          <div id="skill-count-badge" class="tag tag-primary"></div>
          <button class="btn btn-primary" id="predict-btn" onclick="runPrediction()">
            ⚡ Generate Predictions
          </button>
        </div>
      </div>

      <!-- Content area -->
      <div id="careers-content"></div>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script src="js/ai-engine.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  requireAuth();
  renderSidebar('careers');
  renderTopbar('Career Paths', 'Weighted skill, interest, and academic-profile matches');

  const user = getCurrentUser();
  const skills = user.profile.skills || [];
  document.getElementById('skill-count-badge').textContent = `${skills.length} skills`;

  if (user.careerCache && user.careerCache.length > 0 && user.careerCache[0].algorithm !== 'jaccard') {
    renderCareers(user.careerCache);
  } else if (skills.length === 0) {
    renderNoSkills();
  } else {
    renderEmpty();
  }
});

function renderNoSkills() {
  document.getElementById('careers-content').innerHTML = `
    <div class="no-skill-state">
      <div class="ns-icon">💡</div>
      <h2>No Skills Found</h2>
      <p>Add your skills in your profile or upload your resume so our AI can predict your best career matches.</p>
      <div class="flex gap-12 justify-center">
        <a href="profile.html" class="btn btn-primary">✏️ Add Skills</a>
        <a href="resume.html"  class="btn btn-secondary">📄 Upload Resume</a>
      </div>
    </div>`;
}

function renderEmpty() {
  document.getElementById('careers-content').innerHTML = `
    <div class="no-skill-state">
      <div class="ns-icon">🎯</div>
      <h2>Ready to Predict!</h2>
      <p>We found <strong>${(getCurrentUser().profile.skills||[]).length} skills</strong> in your profile.
        Click "Generate Predictions" to get your top 5 career matches.</p>
    </div>`;
}

function runPrediction() {
  const btn  = document.getElementById('predict-btn');
  const user = getCurrentUser();
  const skills    = user.profile.skills    || [];
  const interests = user.profile.interests || [];
  const cgpa      = parseFloat(user.profile.cgpa) || 0;

  if (skills.length === 0) return renderNoSkills();

  btn.disabled  = true;
  btn.innerHTML = '<div class="spinner"></div> Analyzing…';

  // Simulate AI delay
  setTimeout(async () => {
    const results = await predictCareers(skills, interests, cgpa);
    user.careerCache = results;
    saveCurrentUser(user);
    renderCareers(results);
    btn.disabled  = false;
    btn.innerHTML = '⚡ Re-generate';
    showAlert('page-alert', `✅ Top ${results.length} career paths predicted based on your profile!`, 'success');
  }, 1800);
}

function renderCareers(careers) {
  if (!careers || careers.length === 0) { renderEmpty(); return; }

  const html = `
    <div class="career-grid">
      ${careers.map((c, i) => careerCardHTML(c, i+1)).join('')}
    </div>`;
  document.getElementById('careers-content').innerHTML = html;

  // Animate progress bars
  setTimeout(() => {
    document.querySelectorAll('.progress-fill[data-pct]').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
  }, 100);
}

function careerCardHTML(c, rank) {
  const matchedHTML = (c.matchedSkills || []).slice(0,5).map(s =>
    `<span class="tag tag-success">${s}</span>`).join('');
  const missingCount = (c.missingSkills || []).length;
  const reasonHTML   = (c.reasons || []).map(r => `<div class="reason-item">${r}</div>`).join('');

  return `
  <div class="career-card-full rank-${rank}" onclick="location.href='skills.html?career=${c.id}'">
    <div class="ccf-header rank-${rank}">
      <div class="ccf-icon">${c.icon}</div>
      <div style="flex:1">
        <div class="ccf-title">${c.title}</div>
        <div class="ccf-domain">${c.domain}</div>
        <div class="ccf-meta">
          <span class="tag tag-ghost text-xs">💰 ${c.avgSalary}</span>
          <span class="tag tag-ghost text-xs">📈 ${c.growth} Growth</span>
        </div>
      </div>
      <div class="ccf-rank"><div class="rank-badge">${rank === 1 ? '🏆' : '#' + rank}</div></div>
    </div>
    <div class="ccf-body">
      <div class="ccf-score-row">
        <div>
          <div class="ccf-pct">${c.score}%</div>
          <div class="ccf-confidence-label">Confidence Match</div>
        </div>
        <div style="flex:1">
          <div class="progress-bar progress-xl">
            <div class="progress-fill" data-pct="${c.score}" style="width:0%"></div>
          </div>
        </div>
      </div>
      <p class="ccf-desc">${c.description}</p>
      <div class="mb-12">
        <div class="text-xs text-muted mb-6">Matching skills you have:</div>
        <div class="matched-skills">
          ${matchedHTML}
          ${missingCount > 0 ? `<span class="tag tag-danger">${missingCount} missing</span>` : '<span class="tag tag-success">✅ Full match</span>'}
        </div>
      </div>
      <div class="reasoning-box">
        <h4>Why this career?</h4>
        ${reasonHTML || '<div class="reason-item">Good skill alignment with this career path</div>'}
      </div>
    </div>
    <div class="ccf-footer">
      <a href="skills.html?career=${c.id}" class="btn btn-secondary btn-sm" onclick="event.stopPropagation()">
        📊 Skill Gap Analysis
      </a>
      <a href="learning.html?career=${c.id}" class="btn btn-ghost btn-sm" onclick="event.stopPropagation()">
        📚 Learning Path
      </a>
    </div>
  </div>`;
}
</script>
</body>
</html>
